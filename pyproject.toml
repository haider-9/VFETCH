[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vfetch"
dynamic = ["version"]
description = "A friendly cross-platform terminal front-end for yt-dlp"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = ["yt-dlp[default]", "prompt-toolkit>=3.0"]

[project.scripts]
vfetch = "vfetch.cli:main"

[tool.setuptools.dynamic]
version = {attr = "vfetch.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
